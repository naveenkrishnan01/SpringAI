<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="900" fill="#ffffff"/>

  <text x="590" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">SpringAI (llm_test branch) — Architecture</text>
  <text x="590" y="56" text-anchor="middle" font-size="13" fill="#718096">Spring Boot 4 + Spring AI 2.0.0-RC2 · OpenAI chat model · self-evaluating / self-correcting chat endpoint</text>

  <!-- Client -->
  <rect x="480" y="80" width="220" height="50" rx="8" fill="#2d3748"/>
  <text x="590" y="110" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="600">HTTP Client</text>

  <!-- Arrow client -> controllers -->
  <line x1="590" y1="130" x2="590" y2="165" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Controller layer box -->
  <rect x="60" y="170" width="1060" height="150" rx="10" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="80" y="192" font-size="13" font-weight="700" fill="#4a5568">Web Layer (@RestController, base path /api)</text>

  <!-- ChatController -->
  <rect x="90" y="205" width="450" height="100" rx="8" fill="#ffffff" stroke="#4299e1" stroke-width="2"/>
  <text x="315" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">ChatController</text>
  <text x="110" y="248" font-size="12" fill="#2d3748">GET /chat</text>
  <text x="110" y="266" font-size="12" fill="#718096">→ chatClient.prompt(message).call()</text>
  <text x="110" y="286" font-size="12" fill="#2d3748">GET /chat/prompt-stuffing</text>
  <text x="110" y="298" font-size="11" fill="#718096">→ system(pbTemplate) + user(message)</text>

  <!-- selfEvaluatingChatContoller -->
  <rect x="580" y="205" width="450" height="100" rx="8" fill="#ffffff" stroke="#9f7aea" stroke-width="2"/>
  <text x="805" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#6b46c1">selfEvaluatingChatContoller</text>
  <text x="600" y="248" font-size="12" fill="#2d3748">GET /chat/selfEvaluatingChatPrompt</text>
  <text x="600" y="260" font-size="11" fill="#718096">→ system(pbTemplate) + user(message)</text>
  <text x="600" y="280" font-size="12" fill="#2d3748">GET /evaluate/chat</text>
  <text x="600" y="298" font-size="11" fill="#718096">→ call model, then validateAnswer() [@Retryable]</text>

  <!-- resource templates -->
  <rect x="990" y="130" width="150" height="40" rx="6" fill="#fefcbf" stroke="#d69e2e"/>
  <text x="1065" y="154" text-anchor="middle" font-size="11" fill="#744210">pb.st (system prompt)</text>
  <line x1="1065" y1="170" x2="805" y2="205" stroke="#d69e2e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="990" y1="150" x2="535" y2="205" stroke="#d69e2e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- arrows controllers -> ChatClient -->
  <line x1="315" y1="305" x2="450" y2="360" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="805" y1="305" x2="700" y2="360" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ChatClient / Spring AI layer -->
  <rect x="330" y="365" width="480" height="60" rx="8" fill="#e6fffa" stroke="#319795" stroke-width="2"/>
  <text x="570" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#234e52">ChatClient (Spring AI ChatClient.Builder)</text>
  <text x="570" y="410" text-anchor="middle" font-size="11" fill="#2c7a7b">+ SimpleLoggerAdvisor</text>

  <!-- arrow ChatClient -> OpenAI -->
  <line x1="570" y1="425" x2="570" y2="470" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- OpenAI external -->
  <rect x="410" y="475" width="320" height="55" rx="28" fill="#1a202c"/>
  <text x="570" y="498" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">OpenAI ChatModel</text>
  <text x="570" y="516" text-anchor="middle" font-size="11" fill="#a0aec0">spring-ai-starter-model-openai (external API)</text>

  <!-- Evaluation layer box -->
  <rect x="60" y="565" width="1060" height="230" rx="10" fill="#faf5ff" stroke="#d6bcfa" stroke-width="1.5"/>
  <text x="80" y="587" font-size="13" font-weight="700" fill="#6b46c1">Self-Evaluation / Retry Loop (triggered by GET /evaluate/chat)</text>

  <!-- Evaluator -->
  <rect x="100" y="605" width="330" height="90" rx="8" fill="#ffffff" stroke="#9f7aea" stroke-width="2"/>
  <text x="265" y="628" text-anchor="middle" font-size="13" font-weight="700" fill="#6b46c1">FactCheckingEvaluator</text>
  <text x="120" y="650" font-size="11" fill="#2d3748">evaluate(question, [], aiResponse)</text>
  <text x="120" y="668" font-size="11" fill="#718096">prompt built from factCheck.st</text>
  <text x="120" y="684" font-size="11" fill="#718096">uses its own ChatClient.Builder → OpenAI</text>

  <rect x="990" y="605" width="150" height="40" rx="6" fill="#fefcbf" stroke="#d69e2e"/>
  <text x="1065" y="629" text-anchor="middle" font-size="11" fill="#744210">factCheck.st</text>
  <line x1="990" y1="625" x2="430" y2="640" stroke="#d69e2e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- decision diamond -->
  <polygon points="530,605 620,650 530,695 440,650" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
  <text x="530" y="646" text-anchor="middle" font-size="12" font-weight="700" fill="#2d3748">isPass?</text>
  <text x="530" y="662" text-anchor="middle" font-size="10" fill="#718096">EvaluationResponse</text>

  <line x1="430" y1="650" x2="440" y2="650" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Yes path -->
  <text x="700" y="620" font-size="11" fill="#276749" font-weight="700">yes</text>
  <line x1="620" y1="630" x2="900" y2="630" stroke="#276749" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="900" y="605" width="150" height="50" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
  <text x="975" y="633" text-anchor="middle" font-size="12" fill="#276749" font-weight="700">return aiResponse</text>

  <!-- No path -->
  <text x="540" y="720" font-size="11" fill="#c0392b" font-weight="700">no</text>
  <line x1="530" y1="695" x2="530" y2="735" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="330" y="740" width="400" height="40" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="2"/>
  <text x="530" y="765" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="700">throw InvalidAnswerException (RuntimeException)</text>

  <!-- retry back -->
  <path d="M 330 760 C 150 760, 100 500, 100 400 C 100 320, 200 260, 300 240" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="105" y="500" font-size="11" fill="#c0392b" font-weight="700" transform="rotate(-90 105 500)">@Retryable(retryFor = InvalidAnswerException.class, maxAttempts = 3)</text>

  <!-- Tests box -->
  <rect x="850" y="700" width="270" height="80" rx="8" fill="#ffffff" stroke="#4299e1" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="985" y="722" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">SpringAIApplicationTests</text>
  <text x="865" y="742" font-size="10.5" fill="#4a5568">RelevancyEvaluator + FactCheckingEvaluator</text>
  <text x="865" y="758" font-size="10.5" fill="#4a5568">drive ChatController directly, incl. a</text>
  <text x="865" y="774" font-size="10.5" fill="#4a5568">RAG-style test using Document context</text>

  <line x1="900" y1="705" x2="700" y2="630" stroke="#4299e1" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="80" y="820" font-size="11" fill="#718096">Solid arrow: synchronous call · Dashed yellow: classpath resource (prompt template) · Dashed red: retry on failed fact-check</text>
  <text x="80" y="840" font-size="11" fill="#718096">Config: OPENAI_API_KEY (env) → spring.ai.openai.api-key · spring-retry + @EnableRetry on SpringAIApplication</text>
</svg>
