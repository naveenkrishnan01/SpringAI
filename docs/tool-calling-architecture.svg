<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa" />
  
  <!-- Styles -->
  <style>
    .box { fill: #ffffff; stroke: #333; stroke-width: 2; }
    .label { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
    .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
    .arrow { stroke: #333; stroke-width: 2; fill: #333; }
  </style>

  <text x="400" y="30" class="title">Spring AI Tool Calling Architecture</text>

  <!-- User -->
  <rect x="50" y="80" width="120" height="50" rx="5" class="box" />
  <text x="110" y="110" class="label">User / Client</text>

  <!-- Controller -->
  <rect x="250" y="80" width="150" height="50" rx="5" class="box" />
  <text x="325" y="110" class="label">TimeController</text>

  <!-- ChatClient -->
  <rect x="480" y="80" width="180" height="80" rx="5" class="box" fill="#e7f3ff" />
  <text x="570" y="115" class="label">ChatClient</text>
  <text x="570" y="135" class="label" font-size="12">(timeChatClient)</text>

  <!-- Advisors -->
  <rect x="480" y="200" width="180" height="100" rx="5" class="box" fill="#fff3cd" />
  <text x="570" y="225" class="label" font-weight="bold">Advisors</text>
  <text x="570" y="245" class="label" font-size="12">Chat Memory</text>
  <text x="570" y="265" class="label" font-size="12">Logger / Audit</text>

  <!-- AI Model -->
  <rect x="250" y="200" width="150" height="80" rx="5" class="box" fill="#d1e7dd" />
  <text x="325" y="235" class="label">AI Model</text>
  <text x="325" y="255" class="label" font-size="12">(OpenAI, etc.)</text>

  <!-- Tools -->
  <rect x="250" y="350" width="150" height="80" rx="5" class="box" fill="#f8d7da" />
  <text x="325" y="385" class="label" font-weight="bold">Tools</text>
  <text x="325" y="405" class="label" font-size="12">TimeTools</text>

  <!-- Arrows -->
  <!-- User to Controller -->
  <line x1="170" y1="105" x2="240" y2="105" class="arrow" />
  <polygon points="240,105 230,100 230,110" fill="#333" />
  <text x="205" y="100" class="label" font-size="10">HTTP Request</text>

  <!-- Controller to ChatClient -->
  <line x1="400" y1="105" x2="470" y2="105" class="arrow" />
  <polygon points="470,105 460,100 460,110" fill="#333" />

  <!-- ChatClient to Advisors -->
  <line x1="570" y1="160" x2="570" y2="190" class="arrow" />
  <polygon points="570,195 565,185 575,185" fill="#333" />

  <!-- ChatClient/Advisors to Model -->
  <line x1="480" y1="240" x2="410" y2="240" class="arrow" />
  <polygon points="405,240 415,245 415,235" fill="#333" />
  <text x="445" y="235" class="label" font-size="10">Prompt</text>

  <!-- Model to Tools (Function Call) -->
  <path d="M 325 280 L 325 340" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5,5" />
  <polygon points="325,345 320,335 330,335" fill="#333" />
  <text x="365" y="315" class="label" font-size="10" fill="red">Tool Calling</text>

  <!-- Tools back to Model -->
  <path d="M 300 350 L 300 285" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5,5" />
  <polygon points="300,285 295,295 305,295" fill="#333" />
  <text x="260" y="315" class="label" font-size="10">Result</text>

  <!-- Model to ChatClient -->
  <path d="M 325 200 L 325 150 L 475 150" fill="none" stroke="#333" stroke-width="2" />
  <polygon points="480,150 470,145 470,155" fill="#333" />
  <text x="400" y="145" class="label" font-size="10">Final Response</text>

</svg>
