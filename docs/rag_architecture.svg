<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#fcfcfc" />

  <!-- User -->
  <circle cx="60" cy="150" r="30" fill="#007bff" filter="url(#shadow)" />
  <text x="60" y="200" text-anchor="middle" font-family="Arial" font-weight="bold">User</text>

  <!-- Spring AI Container -->
  <rect x="150" y="30" width="600" height="640" rx="15" fill="none" stroke="#28a745" stroke-width="2" stroke-dasharray="8,4" />
  <text x="450" y="55" text-anchor="middle" font-family="Arial" font-weight="bold" fill="#28a745" font-size="18">Spring AI Application</text>

  <!-- RAG Controller -->
  <rect x="180" y="100" width="140" height="80" rx="8" fill="#fff" stroke="#333" filter="url(#shadow)" />
  <text x="250" y="145" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="14">RAGController</text>

  <!-- Vector Store -->
  <path d="M180 300 Q180 280 250 280 Q320 280 320 300 L320 360 Q320 380 250 380 Q180 380 180 360 Z" fill="#e9ecef" stroke="#333" filter="url(#shadow)" />
  <text x="250" y="335" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Qdrant</text>
  <text x="250" y="350" text-anchor="middle" font-family="Arial" font-size="10">Vector Store</text>

  <!-- ChatClient 1 (Memory) -->
  <rect x="400" y="100" width="160" height="80" rx="8" fill="#fff" stroke="#333" filter="url(#shadow)" />
  <text x="480" y="135" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="13">ChatClient</text>
  <text x="480" y="155" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">(chatMemoryChatClient)</text>

  <!-- Web Search RAG Subgraph -->
  <rect x="400" y="250" width="320" height="250" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-dasharray="4,2" />
  <text x="560" y="275" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="14" fill="#495057">Web Search RAG Flow</text>

  <!-- ChatClient 2 (Web) -->
  <rect x="420" y="300" width="140" height="60" rx="5" fill="#fff" stroke="#333" filter="url(#shadow)" />
  <text x="490" y="330" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="11">ChatClient</text>
  <text x="490" y="345" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">(webSearchRAGChatClient)</text>

  <!-- Advisor -->
  <rect x="600" y="300" width="100" height="60" rx="5" fill="#fff" stroke="#333" filter="url(#shadow)" />
  <text x="650" y="325" text-anchor="middle" font-family="Arial" font-size="10">RetrievalAugmentation</text>
  <text x="650" y="340" text-anchor="middle" font-family="Arial" font-size="10">Advisor</text>

  <!-- Web Retriever -->
  <rect x="520" y="410" width="160" height="60" rx="5" fill="#fff" stroke="#333" filter="url(#shadow)" />
  <text x="600" y="445" text-anchor="middle" font-family="Arial" font-size="10">WebSearchDocumentRetriever</text>

  <!-- LLM -->
  <rect x="780" y="110" width="100" height="60" rx="8" fill="#17a2b8" stroke="#333" filter="url(#shadow)" />
  <text x="830" y="145" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="12" fill="white">OpenAI GPT</text>

  <!-- DB -->
  <path d="M400 550 Q400 535 480 535 Q560 535 560 550 L560 610 Q560 630 480 630 Q400 630 400 610 Z" fill="#e9ecef" stroke="#333" filter="url(#shadow)" />
  <text x="480" y="585" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">H2 Database</text>
  <text x="480" y="605" text-anchor="middle" font-family="Arial" font-size="10">JDBC Chat Memory</text>

  <!-- Connections -->
  <!-- User to Controller -->
  <line x1="90" y1="150" x2="180" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="135" y="140" font-family="Arial" font-size="11" text-anchor="middle">GET /chat</text>

  <!-- Controller to VectorStore -->
  <path d="M220 180 L220 280" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="175" y="240" font-family="Arial" font-size="10">1. Manual Search</text>

  <!-- VectorStore to Controller -->
  <path d="M280 280 L280 180" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="325" y="240" font-family="Arial" font-size="10">2. Context</text>

  <!-- Controller to ChatClient1 -->
  <line x1="320" y1="140" x2="400" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="360" y="130" font-family="Arial" font-size="10" text-anchor="middle">3. Invoke</text>

  <!-- ChatClient1 to LLM -->
  <line x1="560" y1="140" x2="780" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="670" y="130" font-family="Arial" font-size="10" text-anchor="middle">Augmented Prompt</text>

  <!-- Memory Connections -->
  <line x1="480" y1="180" x2="480" y2="535" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowhead)" />
  <line x1="480" y1="360" x2="480" y2="535" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowhead)" />

  <!-- Web Search Connections -->
  <line x1="560" y1="330" x2="600" y2="330" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)" />
  <line x1="650" y1="360" x2="650" y2="410" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)" />
</svg>